# Why attribution hooks may skip: see RequiredHook.deployed_entry in bots_host/precommit_hooks.py.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: end-of-file-fixer
    exclude: \.api$
- repo: local
  hooks:
  - id: check-testdata
    name: check-testdata
    entry: agent-scripts/check-testdata.sh
    language: script
    always_run: true
    pass_filenames: false
  - id: script-tests
    name: script-tests
    entry: agent-scripts/tests/run.sh
    language: script
    always_run: true
    pass_filenames: false
- repo: local
  hooks:
  - id: guard-main-push
    name: block direct pushes to main (land through the land gate)
    entry: sh -c 'g="${BOTS_ROOT:-/opt/bots}/bin/guard-main-push"; [ -x "$g" ] &&
      exec "$g"; echo "guard-main-push unavailable at $g" >&2; exit 1'
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - pre-push
  - id: instance-trailer
    name: append instance-id trailer
    entry: sh -c 'g="${BOTS_ROOT:-/opt/bots}/bin/append-instance-trailer"; [ -x "$g"
      ] && exec "$g" "$@"; echo "append-instance-trailer skipped (no bots-host deployment
      at $g)" >&2' sh
    language: system
    stages:
    - prepare-commit-msg
  - id: instance-attribution
    name: fail a managed session's commit that names no author
    entry: sh -c 'g="${BOTS_ROOT:-/opt/bots}/bin/check-instance-attribution"; [ -x
      "$g" ] && exec "$g" "$@"; echo "check-instance-attribution skipped (no bots-host
      deployment at $g)" >&2' sh
    language: system
    stages:
    - commit-msg
default_install_hook_types:
- pre-commit
- pre-push
- prepare-commit-msg
- commit-msg

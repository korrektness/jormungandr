# land-gate.yaml — gates this repo through the bots-host land gate.
# The gate runs test_cmd on each rebased candidate and lands it only if
# that passes. See `request-land init` and
# /opt/bots/docs/bots-host/landing.md.
# Mirrors the Gradle CI workflow. The test tasks provide Z3 (see README.md).
# check-testdata.sh runs first; it needs no build.
test_cmd: ["sh", "-c", "./agent-scripts/check-testdata.sh && ./gradlew --no-daemon detekt apiCheck :formver.compiler-plugin:locality:test :formver.compiler-plugin:test"]
# target_branch: main          # default: origin/HEAD
# review:
#   extra_standards: |
#     - <repo-specific review rules, appended to the packaged brief>

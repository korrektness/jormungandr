# Picks up DumpAssertionDiffExtension from META-INF/services. Autodetection is
# all-or-nothing, so any other Extension service file on the test runtime
# classpath, including one arriving from a dependency, becomes active too. That
# is the cost of not registering the extension per test class.
junit.jupiter.extensions.autodetection.enabled=true

# Each test builds its own Silicon and Z3 processes, so tests share no verifier
# state. Four threads was the fastest setting measured that fits the test JVM's
# heap, with Silicon's parallelism as build.gradle.kts sets it.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4

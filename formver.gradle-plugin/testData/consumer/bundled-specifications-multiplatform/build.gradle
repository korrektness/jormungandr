plugins {
    id "org.jetbrains.kotlin.multiplatform" version "2.3.0"
    id "org.jetbrains.kotlin.formver" version "0.1.0-SNAPSHOT"
}

repositories {
    mavenCentral()
    maven { url System.getProperty("formver.repo") }
}

kotlin {
    jvm()
    explicitApi()
    compilerOptions {
        allWarningsAsErrors = true
        extraWarnings = true
    }
}
